name: Security Vulnerability Report
description: Instructions for securely reporting potential security vulnerabilities in Certsmith
title: "[Security]: "
labels: ["area: security", "status: triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## Critical Security Notice

        Do NOT disclose potential security vulnerabilities in public issues, discussions, or pull requests.

        To report a security vulnerability:
        1. Navigate to the repository's **Security** tab and click **Report a vulnerability** (GitHub Private Vulnerability Reporting).
        2. Alternatively, review our full [Security Policy](https://github.com/certsmith/.github/blob/main/SECURITY.md) for direct contact options.

        Publicly logged issues containing vulnerability details or private key material will be closed and redacted immediately.
  - type: dropdown
    id: severity_estimate
    attributes:
      label: Estimated Severity
      description: Your assessment of the severity based on CVSS metrics.
      options:
        - "Low (Informational / Minor hardening)"
        - "Medium (Partial denial of service / Non-default configuration)"
        - "High (Cryptographic bypass / Denial of service on issuing tiers)"
        - "Critical (Remote code execution / Private key extraction)"
    validations:
      required: true
  - type: textarea
    id: confirmation
    attributes:
      label: Acknowledgment
      description: Confirm that no secret keys or unredacted exploit payloads are posted here.
      placeholder: I acknowledge that I will submit the technical disclosure privately via the Security tab.
    validations:
      required: true
